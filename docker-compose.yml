version: '3.2'
services:
  regiu:
    image: "regiu:1.0"
    ports:
      - "80:80"
    networks:
      - regiu-network
    depends_on:
      - chamberlain
  chamberlain:
    image: "chamberlain:1.0"
    ports:
      - "8080:8080"
    volumes:
      - /var:/var
      - /home/coregiu/workspace/runtime/chamberlain/chamberlain.yml:/chamberlain.yml
    networks:
      - regiu-network
    depends_on:
      - database
      - redis
  database:
    image: "mysql:latest"
    ports:
      - "3306:3306"
    volumes:
      - /home/coregiu/workspace/runtime/chamberlain/database:/var/lib/mysql 
      - /home/coregiu/workspace/runtime/chamberlain/database:/etc/mysql/conf.d
    environment:
      MYSQL_ROOT_PASSWORD: ""
    networks:
      - regiu-network
  redis:
    image: "redis:latest"
    ports:
      - "6379:6379"
    environment:
      MYSQL_ROOT_PASSWORD: ""
    networks:
      - regiu-network
networks:
  regiu-network:
    driver: overlay

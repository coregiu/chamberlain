# ============================================================
# Grafana 数据源自动配置（启动时自动加载，无需手工添加）
# ============================================================
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s       # 与 Prometheus 抓取间隔对齐